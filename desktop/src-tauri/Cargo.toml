[package]
name = "aethra-kairos"
version = "0.3.0"
description = "Aethra Kairos — the open-source label player"
authors = ["Aethra Kairos"]
license = "MIT"
repository = "https://github.com/kmay89/aethrakairos"
edition = "2021"
rust-version = "1.77.2"

# The library the thin binary calls into — keeps a single entry point for
# desktop and any future mobile target.
[lib]
name = "aethra_kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one dependency the Hue bridge costs us. rustls rather than the system
# stack because the bridge's certificate is signed by Signify's own private CA
# and has to be handled explicitly rather than trusted by accident.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# the twice-a-day update re-check needs one timer; tokio is already in the
# tree under tauri and reqwest, so this adds a feature, not a dependency
tokio = { version = "1", features = ["time"] }

# Now Playing + media keys. macOS-only on purpose: its Linux backend wants the
# system dbus library, which a Linux checkout running `cargo test` on the pure
# functions should not have to install for a surface only the Mac app has.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

# a fast, predictable release binary — the point of going native. opt-level 3
# rather than "s": the shell's hot paths are TLS and JSON at lamp-frame rate
# today and audio DSP in the staged plan, work an M-series core should run at
# full speed; the binary-size cost is noise next to the WebKit process.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
