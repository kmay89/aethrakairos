# Separate every track into stems, a BATCH at a time, and bank the envelopes.
#
# tools/stems.py runs Demucs (htdemucs) offline and reduces each stem — drums,
# bass, vocals, other — to a tiny 12 Hz digit envelope written into
# catalog.json (mix.stems). Source separation is a neural model, so this is the
# heavy job in the pipeline: it processes at most `limit` still-missing tracks
# per run (default 24) and commits the result, so no single run runs long and
# the scheduled cron chews through the backlog over a few days. New releases and
# on-demand runs top it up. The commit carries [skip ci] so it never re-triggers.
#
# CPU runners are fine — htdemucs runs on CPU, just slower; the batch cap keeps
# each job well inside the time limit. The torch model is cached between runs.
#
# NOTE on branch protection: like the enrich job, this PUSHES to main. If you
# require PRs, allow the Actions bot to bypass (Settings → Branches), or switch
# this to open a PR instead.
name: Separate stems

on:
  push:
    branches: [main]
    paths:
      - 'docs/audio/**'
      - 'tools/stems.py'
      - '.github/workflows/stems.yml'
  schedule:
    - cron: '41 4 * * *'     # daily, a quiet hour (UTC), to work through the backlog
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max tracks to separate this run'
        required: false
        default: '24'

concurrency:
  group: separate-stems
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install numpy + Demucs (CPU torch)
        run: pip install --quiet numpy demucs
      - name: Cache the Demucs model
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch
          key: demucs-htdemucs-v1
      - name: Verify the envelope reduction
        run: python3 tools/stems.py --selftest
      - name: Separate a batch
        run: |
          # --sidecar persists exactly which stems this run computed (keyed by
          # track identity) OUTSIDE the repo tree, so a lost push can re-apply
          # them onto the latest catalog without re-running Demucs.
          python3 tools/stems.py --limit "${{ github.event.inputs.limit || 24 }}" \
            --sidecar "$RUNNER_TEMP/stems_batch.json"
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/catalog.json)" ]]; then
            echo "no stem changes"; exit 0
          fi
          git config user.name  "aethra-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          git commit -m "chore: bank a batch of stem envelopes (auto) [skip ci]"
          # A batch is ~hours of CPU separation — never throw it away on a racing
          # push. If main advanced under us (a player release, or an overlapping
          # stem batch that grabbed the SAME still-missing tracks), a git rebase
          # would collide on the pretty-printed JSON. Instead reset onto the new
          # tip and RE-APPLY our computed stems by track identity: tracks the
          # other run already banked keep theirs, ours that are still missing get
          # added — a clean union, re-serialized whole, so there is nothing to
          # conflict-resolve. The sidecar survives the reset (it lives in
          # $RUNNER_TEMP, outside the work tree).
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) — merging our batch onto latest main"
            git fetch origin main || true
            git reset --hard origin/main
            python3 tools/stems.py --reapply "$RUNNER_TEMP/stems_batch.json"
            if [[ -z "$(git status --porcelain docs/catalog.json)" ]]; then
              echo "every track in our batch was already banked upstream — nothing left to push"
              pushed=1; break
            fi
            git add docs/catalog.json
            git commit -m "chore: bank a batch of stem envelopes (auto) [skip ci]"
          done
          if [[ -z "$pushed" ]]; then
            echo "::error::push still rejected after retries — batch not banked this run"
            exit 1
          fi
          echo "stems banked and pushed"
