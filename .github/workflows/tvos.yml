# Build the native Apple TV app (SwiftUI, tvos/).
#
#   • PR / manual "none"      → unsigned compile check on a Mac runner. Proves
#                               every Swift file and the asset catalog build,
#                               costs no credentials.
#   • Manual "testflight"     → archive, sign under the team's cloud-managed
#                               distribution certificate, upload to App Store
#                               Connect / TestFlight.
#
# Signing is OPT-IN on the `ENABLE_TVOS_SIGNING` repo VARIABLE (not a secret) —
# set it to exactly `true` once the four secrets exist (APPLE_TEAM_ID,
# ASC_ISSUER_ID, ASC_KEY_ID, ASC_API_KEY_P8_BASE64). Until then, testflight
# runs refuse early with a pointer at the runbook. There is no certificate or
# .p12 anywhere in this pipeline: the App Store Connect API key lets xcodebuild
# mint and use a cloud-managed Apple Distribution certificate by itself
# (-allowProvisioningUpdates + the -authenticationKey* trio).
#
# The ARCHIVE is deliberately UNSIGNED and all signing happens at EXPORT.
# `xcodebuild archive` under automatic signing asks Apple for a *development*
# profile, and development profiles require at least one registered device —
# which a fresh team (and every CI runner) does not have ("Your team has no
# devices from which to generate a provisioning profile"). The App Store
# profile the export step creates needs no devices at all, so archiving with
# signing off and letting -exportArchive sign is both sufficient and the only
# device-free path.
#
# Runbook: tvos/TESTFLIGHT.md.

name: tvos

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'none = compile check only · testflight = archive, sign, upload to TestFlight'
        type: choice
        options: [none, testflight]
        default: none
  pull_request:
    paths:
      - 'tvos/**'
      - '.github/workflows/tvos.yml'

concurrency:
  group: tvos-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  build:
    name: compile check (unsigned)
    if: inputs.channel != 'testflight'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select newest stable Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build (generic tvOS device, signing off)
        run: |
          set -o pipefail
          xcodebuild build \
            -project tvos/AethraKairos.xcodeproj \
            -scheme AethraKairosTV \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E 'error|warning|BUILD' || true
          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' build.log; then
            echo '===== last 200 lines of build.log (the failure in full) ====='
            tail -200 build.log
            exit 1
          fi

  # Eyes before shipping: boot a tvOS Simulator, install the app, launch it,
  # and photograph what a viewer actually sees. The launch frame proves the
  # focus engine is alive (the welcome's PLAY chip renders its focus ring
  # only when focused) — the exact regression that reached hardware three
  # times while every compile check stayed green. Since stage 4 of the dance
  # layer the job also FILMS six rooms under the drive-demo metronome (the
  # MOTION FILM block below) so a beat landing is visible at 24 fps.
  sim-shots:
    name: simulator screenshots (focus smoke)
    if: inputs.channel != 'testflight'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select newest stable Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for the tvOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project tvos/AethraKairos.xcodeproj \
            -scheme AethraKairosTV \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -5

      - name: Boot, install, launch, photograph
        run: |
          # The 1080p framing when the runner has it: the Apple TV 4K simulator
          # draws a 3840x2160 framebuffer, and on the runner's paravirtualised
          # GPU the ray-marched rooms then render at 1–2 fps (the motion film's
          # 24 fps frames come back 90 % duplicates); the same device "(at
          # 1080p)" is a quarter of the pixels. The stills are read at 640x360
          # in this log either way.
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          tv = [d for runtime, devs in devices.items() if "tvOS" in runtime for d in devs]
          def rank(d):
              name = d.get("name", "")
              return 0 if "1080p" in name else 1 if name == "Apple TV" else 2
          tv.sort(key=rank)
          if tv:
              print(tv[0]["udid"])
          ')"
          if [ -z "$UDID" ]; then
            RUNTIME="$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "tvOS" and r.get("isAvailable")]
          print(rts[-1]["identifier"] if rts else "")
          ')"
            [ -n "$RUNTIME" ] || { echo "::error::No tvOS simulator runtime on this runner."; exit 1; }
            UDID="$(xcrun simctl create smoke-atv 'Apple TV 4K (3rd generation) (at 1080p)' "$RUNTIME" 2>/dev/null \
                    || xcrun simctl create smoke-atv 'Apple TV 4K (3rd generation)' "$RUNTIME")"
          fi
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "::error::Built .app not found."; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.aethrakairos.tv
          sleep 14
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/01-launch-welcome.png
          echo "The welcome should show PLAY carrying its focus ring (ice outline, lifted)."
          # Live rooms, via the CI camera hooks: -introSeen YES skips the
          # welcome (read natively by @AppStorage), --field starts with the
          # shelves down, --start-room opens on a named room. Two frames:
          # the signature spiral and the SCOPE trace.
          # --drive-demo pumps a synthetic 126 BPM signal through the ears, so
          # the frames show each room UNDER music — reactivity in a still.
          for ROOM in spiral scope julia helix band ribbons comets fern flame sheets bubbles drift filament soapfilm lsystem hilbert koch dragon cantor tonnetz harmonograph overtones euclid phase ulam cardioid collatz mediant zeta karman caustics hopf knots benard orrery lensing pulsar analemma eclipse telegraph semaphore scribe cipher babel rain terra stokes orbitals dna maxwell seventeen minimal minkowski boltzmann shuffle stellarator flux carom ballpit masonry wake brachisto iris kutta aurora cochlea coriolis seismic tides vortex plateau escapement hubble; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room "$ROOM" --drive-demo --fixed-rolls
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-$ROOM.png"
          done
          # FRACTAL FIELD, every form: --rolls pins the three dice. r0 = (n+0.5)/10
          # deals form n (BULB QUARTZ SPIRE CUBE VOID SPONGE TETRA JULIA OCTA
          # WEAVE); r1 / r2 walk the surface and space dice so the ten frames
          # also show each of the ten surfaces and ten spaces once.
          N=0
          for ROLLS in 0.05,0.65,0.35 0.15,0.95,0.45 0.25,0.05,0.05 0.35,0.55,0.25 0.45,0.25,0.65 \
                       0.55,0.15,0.75 0.65,0.75,0.55 0.75,0.35,0.95 0.85,0.45,0.15 0.95,0.85,0.85; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room fractal --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-fractal-$N.png"
            echo "room-fractal-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # NAVE, every face: r0 < 0.5 deals PIERCED SHELLS (else HANGING
          # FILIGREE), r1 < 0.5 THE AISLE (else THE CROSSINGS), r2 in thirds
          # the light: LANTERN IN HAND, LANTERN AHEAD, VOTIVE LIGHTS. Twelve
          # frames, shells first, in that order.
          N=0
          for ROLLS in 0.25,0.25,0.15 0.25,0.25,0.5 0.25,0.25,0.85 0.25,0.75,0.15 0.25,0.75,0.5 0.25,0.75,0.85 \
                       0.75,0.25,0.15 0.75,0.25,0.5 0.75,0.25,0.85 0.75,0.75,0.15 0.75,0.75,0.5 0.75,0.75,0.85; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room nave --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-nave-$N.png"
            echo "room-nave-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # PLOTTER, every face: r0 in quarters deals the pen (SECTIONS
          # ENGRAVING ISOLINES INK), r1 in thirds the flake (WHORL FLAKE
          # CORAL); r2 is the orbit phase, varied so the frames show the
          # orbit too. Twelve frames, pen by pen.
          N=0
          for ROLLS in 0.125,0.167,0.11 0.125,0.5,0.30 0.125,0.833,0.62 0.375,0.167,0.30 0.375,0.5,0.62 0.375,0.833,0.85 \
                       0.625,0.167,0.62 0.625,0.5,0.85 0.625,0.833,0.11 0.875,0.167,0.85 0.875,0.5,0.11 0.875,0.833,0.30; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room plotter --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-plotter-$N.png"
            echo "room-plotter-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # SPECTRAL, every face: r0 in thirds deals the fold (THREEFOLD
          # FOURFOLD FIVEFOLD), r1 in halves the primitive (TORUS BEADS), r2
          # in thirds the framing (THE MANDALA, THE CROWN, THE PENDANT).
          # Eighteen frames, fold by fold. --drive-demo runs a beat grid, so
          # look for the lamp lighting the great ring just after each beat.
          N=0
          for ROLLS in 0.1667,0.25,0.1667 0.1667,0.25,0.5 0.1667,0.25,0.8333 0.1667,0.75,0.1667 0.1667,0.75,0.5 0.1667,0.75,0.8333 \
                       0.5,0.25,0.1667 0.5,0.25,0.5 0.5,0.25,0.8333 0.5,0.75,0.1667 0.5,0.75,0.5 0.5,0.75,0.8333 \
                       0.8333,0.25,0.1667 0.8333,0.25,0.5 0.8333,0.25,0.8333 0.8333,0.75,0.1667 0.8333,0.75,0.5 0.8333,0.75,0.8333; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room spectral --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-spectral-$N.png"
            echo "room-spectral-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # FLUID, every face: r0 in thirds deals the face (THE DANCE, THE
          # STORM, THE VEIL); r1 and r2 seed the dancers' figures and phases
          # and r1's half picks the whirl's direction. Six frames, two seeds a
          # face. --drive-demo runs a beat grid, so look for the splash — a
          # heavier blob of ink riding each trail from the moment of the hit.
          N=0
          for ROLLS in 0.1667,0.25,0.3 0.1667,0.75,0.8 0.5,0.25,0.3 0.5,0.75,0.8 0.8333,0.25,0.3 0.8333,0.75,0.8; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room fluid --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-fluid-$N.png"
            echo "room-fluid-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # QUARTET, both faces: r0 in halves deals THE SCORE or THE RINGS.
          # The drive demo has no stems, so the room shows the live past only
          # (the future is honestly dark) — look for four strands through now.
          N=0
          for ROLLS in 0.25,0.3,0.3 0.75,0.6,0.6; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room quartet --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-quartet-$N.png"
            echo "room-quartet-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # GLASS, all three faces: r0 in thirds deals THE CAGE, THE CUBE or
          # THE STAR — look for clear rods bright at the edge, lit beads, and
          # the nested frames falling toward a warm core on void.
          N=0
          for ROLLS in 0.15,0.3,0.3 0.5,0.6,0.6 0.85,0.2,0.2; do
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room glass --drive-demo --rolls "$ROLLS"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/room-glass-$N.png"
            echo "room-glass-$N: rolls $ROLLS"
            N=$((N + 1))
          done
          # MOTION FILM — the TV's dance readout (stage 4 of the dance layer).
          # Stage 2's burst of eight simctl screenshots cost 0.45–2.3 s apiece
          # and spanned 4–13 s against a 2.1 Hz drive: nothing at beat
          # resolution. Now six rooms under the --drive-demo metronome (126 BPM
          # = 2.1 Hz, a kick-class bass pump; its beats fall on
          # CACurrentMediaTime × 2.1, the host's uptime, so the film's start
          # phase against the drive is unknown and the report folds the motion
          # at the drive's period instead) are each FILMED for 4 s by simctl's
          # recorder, then its first 5 s split by ffmpeg into a constant 24 fps
          # at 320 px wide: `fps=24` duplicates or drops to the grid, so every
          # frame pair spans exactly 1/24 s and the deltas are time-normalised
          # (a recorder slow to flush keeps filming past the window; those
          # frames are not the room's). The report
          # step turns the frames into per-frame mean |delta| (MOTION24
          # room=... lines), peak/median, the fold against the drive and ONE
          # 16-frame montage per room. Reported, not gated — stage 6 makes it
          # law (max delta > 0.002, peakToMedian < 8, a body after the hit:
          # delta rising over >= 2 frames).
          # The recorder is scripted so that a room which films nothing says
          # why (run 39533478950 filmed nothing in any room, and the reasons
          # sat thousands of lines above the log tail a reviewer can reach):
          # (1) --display=external, the only display simctl's usage grants a
          # tvOS device (without it the recorder on an Apple TV simulator
          # never starts and ignores SIGINT: PR #302's run, and #303's first,
          # lost 36 s a room to that), with the documented --codec=h264; a try
          # that leaves no film ffmpeg can split is retried once with no
          # options at all (the default codec, HEVC; ffmpeg splits either).
          # (2) The 4 s
          # window opens once the recorder prints "Recording started" (polled,
          # 80 × 0.25 s); one that exits first is reported, one alive but
          # silent is filmed anyway (a line that shows up late still sets
          # started=yes, with a note).
          # (3) A plain `cmd &` in a non-interactive bash runs with SIGINT
          # IGNORED (the POSIX rule for asynchronous lists), so the subshell
          # resets the disposition (trap - INT) and exec's the recorder: $! is
          # the recorder itself, its ignored/caught signal masks are logged
          # (SIGINT is 0x2) and `wait` returns its exit status. (4) simctl
          # writes the .mov only when SIGINT finalises it ("Wrote video to:");
          # the wait after SIGINT is bounded (120 × 0.25 s: under SPECTRAL's
          # load the simulator took more than 10 s to flush a film) and a
          # recorder that will not stop is killed (exit 137), so a room
          # reports missing frames instead of hanging the job; a room whose
          # first try left no splittable film gets the external display once
          # more before the optionless try. (5) A try costs at most 56 s
          # (poll 20 + film 4 + SIGINT wait 30 + SIGKILL wait 2) and starts
          # only while the loop is under its 330 s budget (a filmed room costs
          # 25–40 s, most of it ffmpeg's split), so six rooms end in under
          # 7 min even if every recorder hangs; a try the budget skips says so
          # in the room log. The evidence stays in shots/:
          # burst-env.txt (the toolchain, once), burst-<room>.rec.log (recorder
          # output, ffmpeg errors, [ci] notes) and burst-<room>.rec.status
          # (key=value: attempt, exit, bytes, started); the report step, LAST
          # in the job, prints it beside each MOTION24 line. No room's failure
          # fails this step. ffmpeg ships on the GitHub macOS images; the brew
          # fallback is for an image that lost it.
          command -v ffmpeg >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg \
            || echo "::warning::ffmpeg unavailable — the motion films cannot be split into frames"
          bytes() { if [ -f "$1" ]; then wc -c < "$1" | tr -d ' '; else echo 0; fi; }
          {
            echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "host: $(uname -srm), macOS $(sw_vers -productVersion 2>/dev/null || echo n/a)"
            echo "bash: $BASH_VERSION"
            xcodebuild -version 2>&1 | sed 's/^/xcodebuild: /'
            xcrun simctl list devices --json 2>/dev/null | python3 -c '
          import json, sys
          for rt, devs in json.load(sys.stdin)["devices"].items():
              for d in devs:
                  if d.get("udid") == sys.argv[1]:
                      print("simulator: %s, %s, %s, %s" % (d.get("name"), rt, sys.argv[1], d.get("state")))
                      raise SystemExit
          print("simulator: %s (not in simctl list)" % sys.argv[1])
          ' "$UDID" 2>/dev/null || echo "simulator: $UDID (simctl list unreadable)"
            if command -v ffmpeg >/dev/null 2>&1; then
              echo "ffmpeg: $(ffmpeg -version 2>&1 | head -1)"
            else
              echo "ffmpeg: absent"
            fi
          } > shots/burst-env.txt 2>&1 || true
          sed 's/^/burst-env: /' shots/burst-env.txt || true
          note() { echo "[ci] try $TRY_LABEL: $*" >> "shots/burst-$ROOM.notes"; }
          # film_try LABEL [recorder options...] sets TRY_PID TRY_STARTED TRY_EXIT TRY_BYTES TRY_MSG
          film_try() {
            TRY_LABEL="$1"; shift
            TRY_PID=na; TRY_STARTED=no; TRY_EXIT=na; TRY_BYTES=0; TRY_MSG=""
            MOV="$PWD/shots/burst-$ROOM.mov"
            rm -f "$MOV" "shots/burst-$ROOM.try" "shots/burst-$ROOM.notes"
            echo "[ci] try $TRY_LABEL: xcrun simctl io $UDID recordVideo ${*:+$* }$MOV" >> "$LOG"
            ( trap - INT; exec xcrun simctl io "$UDID" recordVideo "$@" "$MOV" ) > "shots/burst-$ROOM.try" 2>&1 &
            TRY_PID=$!
            T=0
            while [ "$T" -lt 80 ]; do
              if grep -q 'Recording started' "shots/burst-$ROOM.try" 2>/dev/null; then TRY_STARTED=yes; break; fi
              kill -0 "$TRY_PID" 2>/dev/null || break
              sleep 0.25
              T=$((T + 1))
            done
            if [ "$TRY_STARTED" = no ] && grep -q 'Recording started' "shots/burst-$ROOM.try" 2>/dev/null; then
              TRY_STARTED=yes
            fi
            if kill -0 "$TRY_PID" 2>/dev/null; then
              note "pid $TRY_PID sigignore/sigcatch/command: $( { ps -o sigignore=,sigcatch=,command= -p "$TRY_PID" 2>/dev/null || ps -o stat=,command= -p "$TRY_PID" 2>&1; } | head -1)"
              if [ "$TRY_STARTED" = yes ]; then
                note "\"Recording started\" after $((T * 250)) ms; filming 4 s"
              else
                note "no \"Recording started\" within 20 s; filming 4 s anyway"
              fi
              sleep 4
              kill -INT "$TRY_PID" 2>/dev/null || true
              S=0
              while [ "$S" -lt 120 ] && kill -0 "$TRY_PID" 2>/dev/null; do sleep 0.25; S=$((S + 1)); done
              if kill -0 "$TRY_PID" 2>/dev/null; then
                note "still running 30 s after SIGINT; SIGKILL"
                kill -KILL "$TRY_PID" 2>/dev/null || true
                S=0
                while [ "$S" -lt 8 ] && kill -0 "$TRY_PID" 2>/dev/null; do sleep 0.25; S=$((S + 1)); done
              else
                note "stopped $((S * 250)) ms after SIGINT"
              fi
            elif [ "$TRY_STARTED" = yes ]; then
              note "exited right after \"Recording started\", before SIGINT"
            else
              note "exited before \"Recording started\" ($((T * 250)) ms in)"
            fi
            if kill -0 "$TRY_PID" 2>/dev/null; then
              note "survived SIGKILL; not waited for"
            else
              TRY_EXIT=0
              wait "$TRY_PID" 2>> "shots/burst-$ROOM.notes" || TRY_EXIT=$?
            fi
            if [ "$TRY_STARTED" = no ] && grep -q 'Recording started' "shots/burst-$ROOM.try" 2>/dev/null; then
              TRY_STARTED=yes
              note "\"Recording started\" appeared only after the 20 s poll (late or buffered output)"
            fi
            TRY_BYTES="$(bytes "$MOV")"
            # the recorder's most telling line: its first error-like line, else a usage line, else
            # its first line ("Wrote video to: <path>" is skipped by the first two: the path is not a message)
            TRY_MSG="$( { grep -v '^Wrote video to:' "shots/burst-$ROOM.try" | grep -i -E 'error|invalid|unrecogni|unknown|not supported|fail|denied|refus'
                          grep -v '^Wrote video to:' "shots/burst-$ROOM.try" | grep -i 'usage'
                          grep -v '^[[:space:]]*$' "shots/burst-$ROOM.try"; } 2>/dev/null | head -1 | cut -c1-120)" || true
            note "exit $TRY_EXIT, film $TRY_BYTES bytes"
            cat "shots/burst-$ROOM.try" "shots/burst-$ROOM.notes" >> "$LOG" 2>/dev/null || true
            rm -f "shots/burst-$ROOM.try" "shots/burst-$ROOM.notes"
            TRIES="$TRIES $TRY_LABEL: exit=$TRY_EXIT started=$TRY_STARTED bytes=$TRY_BYTES msg=\"$TRY_MSG\";"
            echo "try_$TRY_LABEL=exit=$TRY_EXIT started=$TRY_STARTED bytes=$TRY_BYTES pid=$TRY_PID msg=$TRY_MSG" >> "shots/burst-$ROOM.tries"
            return 0
          }
          # split_film sets FRAMES: the film's 24 fps frames (0 without a film or without ffmpeg)
          split_film() {
            rm -f shots/burst-"$ROOM"-[0-9][0-9][0-9].png
            if [ -s "shots/burst-$ROOM.mov" ]; then
              if command -v ffmpeg >/dev/null 2>&1; then
                # the film's first 5 s only: a recorder that takes long to flush keeps the film
                # open past the 4 s window (815 frames, 90 % duplicates, for SPECTRAL in one run),
                # and the frames past the window are the flush, not the room
                ffmpeg -nostdin -hide_banner -loglevel error -y -i "shots/burst-$ROOM.mov" \
                  -t 5 -vf "fps=24,scale=320:-1" "shots/burst-$ROOM-%03d.png" >> "$LOG" 2>&1 \
                  || echo "[ci] ffmpeg could not split the $TRY_LABEL film (exit $?)" >> "$LOG"
              else
                echo "[ci] ffmpeg absent; the film is not split" >> "$LOG"
              fi
            fi
            FRAMES="$(ls shots/burst-"$ROOM"-[0-9][0-9][0-9].png 2>/dev/null | wc -l | tr -d ' ')"
            return 0
          }
          # filmed: the last try left a film ffmpeg could split (or there is no ffmpeg to ask)
          filmed() { [ "$TRY_BYTES" -gt 0 ] 2>/dev/null && { [ "$FRAMES" -gt 1 ] 2>/dev/null || ! command -v ffmpeg >/dev/null 2>&1; }; }
          # the loop's budget: a try costs at most 56 s (poll 20 + film 4 + SIGINT wait 30 + SIGKILL
          # wait 2) and starts only while the loop is under 330 s, so six rooms end in under 7 min even
          # if every recorder hangs; a try the budget skips is noted in the room log (attempt=none)
          FILM_T0=$SECONDS
          film_budget_ok() {
            if [ $((SECONDS - FILM_T0)) -lt 330 ]; then return 0; fi
            echo "[ci] no $1 try: the film loop's 330 s budget is spent ($((SECONDS - FILM_T0)) s in)" >> "$LOG"
            return 1
          }
          # light rooms first: on a slow runner a ray-marched room renders at 1–2 fps and its
          # recorder takes 20–30 s to flush, and the loop's budget must not let one of those cost
          # the rooms after it
          for ROOM in plotter spiral pulse fractal nave spectral; do
            LOG="shots/burst-$ROOM.rec.log"
            rm -f "shots/burst-$ROOM.mov" "shots/burst-$ROOM.rec.status" "shots/burst-$ROOM.tries" shots/burst-"$ROOM"-[0-9][0-9][0-9].png
            echo "[ci] room $ROOM, $(date -u '+%H:%M:%SZ')" > "$LOG"
            xcrun simctl terminate "$UDID" com.aethrakairos.tv 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --start-room "$ROOM" --drive-demo >> "$LOG" 2>&1 \
              || echo "[ci] launch failed (exit $?); filming whatever is on screen" >> "$LOG"
            sleep 6
            TRIES=""; TRY_PID=na; TRY_STARTED=no; TRY_EXIT=na; TRY_BYTES=0; FRAMES=0; ATTEMPT=none
            # a try counts when it leaves a film ffmpeg can split (or there is no ffmpeg to ask);
            # the retry, without options, keeps its film whatever it holds. simctl's usage says a
            # tvOS device records only its "external" display, and the Apple TV simulator proved
            # it: without --display=external the recorder never starts and ignores SIGINT
            if film_budget_ok external; then
              film_try external --codec=h264 --display=external --force || true
              split_film || true
            fi
            if filmed; then
              ATTEMPT=external
            else
              # the external display once more (a recorder that started but did not flush its
              # film in time is this case), then the optionless try
              if film_budget_ok external2; then
                film_try external2 --codec=h264 --display=external --force || true
                split_film || true
              fi
              if filmed; then
                ATTEMPT=external2
              elif film_budget_ok default; then
                film_try default || true
                split_film || true
                if [ "$TRY_BYTES" -gt 0 ] 2>/dev/null; then ATTEMPT=default; fi
              fi
            fi
            echo "[ci] verdict: attempt=$ATTEMPT exit=$TRY_EXIT bytes=$(bytes "shots/burst-$ROOM.mov") started=$TRY_STARTED frames=$FRAMES;$TRIES" >> "$LOG"
            {
              echo "room=$ROOM"
              echo "attempt=$ATTEMPT"
              echo "exit=$TRY_EXIT"
              echo "bytes=$(bytes "shots/burst-$ROOM.mov")"
              echo "started=$TRY_STARTED"
              echo "pid=$TRY_PID"
              echo "frames=$FRAMES"
              cat "shots/burst-$ROOM.tries" 2>/dev/null || true
            } > "shots/burst-$ROOM.rec.status" || true
            rm -f "shots/burst-$ROOM.tries"
            echo "burst-$ROOM: $FRAMES frames at 24 fps from $(bytes "shots/burst-$ROOM.mov") bytes (attempt $ATTEMPT, recorder exit $TRY_EXIT)"
            sed 's/^/  /' "$LOG" || true
          done

      # The artifact store is unreachable from some review environments, so
      # the frame also travels inside the log: an ice-ring pixel count (the
      # focus ring's color is nowhere else on the welcome) and a base64 JPEG
      # any reader of this log can decode back into the picture.
      - name: Report the frames into the log
        run: |
          pip3 install --quiet pillow 2>/dev/null || pip3 install --quiet --break-system-packages pillow 2>/dev/null || true
          python3 - << 'EOF' || echo "pixel scan unavailable"
          from PIL import Image
          im = Image.open('shots/01-launch-welcome.png').convert('RGB')
          w, h = im.size
          px = im.load()
          ice = 0
          for y in range(0, h, 2):
              for x in range(0, w, 2):
                  r, g, b = px[x, y]
                  if abs(r-110) < 50 and abs(g-231) < 45 and abs(b-255) < 45:
                      ice += 1
          print(f"ICE-RING PIXELS (1/4 sampled): {ice}  ({w}x{h})")
          print("VERDICT:", "FOCUS RING VISIBLE" if ice > 150 else "NO FOCUS RING")
          EOF
          # The per-face dumps, in two passes so the rooms under review sit in
          # the reachable tail of the log (a reader with get_job_logs sees the
          # last ~5000 lines; a face costs 60–100 of them, a montage 40–80):
          # first every face NOT under review in glob order, then the reviewed
          # rooms in REVERSE priority, so the room of the current stage —
          # spectral, first in priority — is the LAST of the faces, directly
          # before the MOTION report that closes the log.
          REVIEW="pulse spiral plotter nave fractal spectral"   # last = nearest the tail
          dump_face() {
            NAME="$(basename "$1" .png)"
            sips -Z 640 "$1" --out "shots/$NAME.jpg" \
              -s format jpeg -s formatOptions 50 >/dev/null
            echo "== BEGIN BASE64 JPEG ($NAME) =="
            base64 -i "shots/$NAME.jpg" | fold -w 300
            echo "== END BASE64 JPEG ($NAME) =="
          }
          for PNG in shots/*.png; do
            NAME="$(basename "$PNG" .png)"
            case "$NAME" in
              burst-*) continue ;;                      # the films travel as montages below
              room-pulse|room-spiral|room-plotter-*|room-nave-*|room-fractal-*|room-spectral-*) continue ;;
            esac
            dump_face "$PNG"
          done
          for ROOM in $REVIEW; do
            for PNG in "shots/room-$ROOM.png" shots/room-"$ROOM"-*.png; do
              [ -f "$PNG" ] || continue
              dump_face "$PNG"
            done
          done
          # THE MOTION REPORT (stage 4 of the dance layer; not gated until stage
          # 6). Printed LAST so the newest readout sits in the tail of the log
          # that a reader with only the last few thousand lines can reach. For
          # each film: the 24 fps frames greyscaled and downscaled to 160 px
          # wide; delta k = mean |frame k+1 − frame k| in 0..1, stamped at frame
          # k+1's time (the moment the change is seen), every pair spanning
          # exactly 1/24 s; peak/median of the deltas (a comb — one spike over a
          # still — reads high; a body — a delta that rises over frames and
          # falls — reads low); the FOLD of the deltas at the drive's period
          # (1/2.1 s): lagMs is the phase of the folded maximum from the film's
          # first frame (the drive's phase at that frame is unknown — it beats
          # on the host's uptime — so lagMs places the beats inside THIS film
          # and is not comparable across rooms or runs), lockR the share of the
          # motion that sits at 2.1 Hz (the first-harmonic resultant, 0..1; a
          # still or an unlocked drift reads near 0), fold the 12-bin profile
          # normalised to its peak (a body is a hump, a spike one hot bin),
          # beatFrames the frames nearest the folded peaks (1-based, as the
          # PNGs are numbered) and rise the consecutive rising deltas into each
          # — stage 6 wants >= 2 (a body, not a spike). dupes counts deltas of
          # exactly zero (the simulator rendered below 24 fps and ffmpeg
          # repeated a frame); gaps the frame numbers ffmpeg skipped (a delta
          # across a gap is dropped, not stretched). Then ONE montage per room:
          # the 16 frames from the last rest frame before the first folded beat
          # inside the film, 160 px wide each, as a base64 JPEG any reader can
          # decode; a missing frame is a dark tile.
          # Around the films: first BURST24 env | lines (shots/burst-env.txt:
          # date, host, bash, Xcode, simulator, ffmpeg) and BURST24 ls | lines
          # (every burst file but the frames, which are counted per room);
          # after each MOTION24 line, one line
          #   REC24 room=<key> attempt=<external|external2|default|none> exit=<n|na> bytes=<n> started=<yes|no>
          # and the last 12 lines of that room's recorder log, each as
          # REC24 room=<key> | ..., so a room without a film says why in the
          # same tail that carries its MOTION24 line.
          python3 - << 'EOF' || echo "motion report unavailable"
          import base64, glob, io, math, os, re, statistics, time
          from PIL import Image, ImageChops, ImageStat
          ROOMS = ["spectral", "fractal", "nave", "plotter", "spiral", "pulse"]
          FPS = 24.0
          PERIOD = 1.0 / 2.1          # the drive: 126 BPM, beats at CACurrentMediaTime * 2.1
          BINS = 12                   # the fold's resolution: 39.7 ms a bin (a 24 fps frame is 41.7 ms)
          W, MONT, MAXRISE = 160, 16, 8
          def rec24(room):
              # the recorder's facts beside a MOTION24 line: shots/burst-<room>.rec.status
              # (key=value, first key wins) and the last 12 lines of shots/burst-<room>.rec.log
              try:
                  st = {}
                  try:
                      with open(f"shots/burst-{room}.rec.status", encoding="utf-8", errors="replace") as fh:
                          for line in fh:
                              k, sep, v = line.rstrip("\r\n").partition("=")
                              if sep and k not in st:
                                  st[k] = v
                  except OSError:
                      pass
                  mov = f"shots/burst-{room}.mov"
                  nbytes = os.path.getsize(mov) if os.path.isfile(mov) else 0
                  print(f"REC24 room={room} attempt={st.get('attempt') or 'none'} exit={st.get('exit') or 'na'}"
                        f" bytes={nbytes} started={st.get('started') or 'no'}")
                  try:
                      with open(f"shots/burst-{room}.rec.log", encoding="utf-8", errors="replace") as fh:
                          tail = [ln.rstrip() for ln in fh.read().splitlines()][-12:] or ["(recorder log empty)"]
                  except OSError:
                      tail = ["(no recorder log: the film block never reached this room)"]
                  if not st:
                      tail.append("(no rec.status)")
                  for ln in tail:
                      print(f"REC24 room={room} | {ln[:500]}")
              except Exception as e:  # the readout must never cost a MOTION24 line
                  print(f"REC24 room={room} | (recorder readout failed: {e!r})")
          try:
              print("== BURST24 ENVIRONMENT (shots/burst-env.txt) ==")
              try:
                  with open("shots/burst-env.txt", encoding="utf-8", errors="replace") as fh:
                      env = fh.read().splitlines() or ["(empty)"]
              except OSError:
                  env = ["(no shots/burst-env.txt: the film block never ran)"]
              for ln in env:
                  print(f"BURST24 env | {ln[:300]}")
              print("== BURST24 FILES (shots/burst-*; the 24 fps frames counted per room) ==")
              listing, frames = [], {}
              for p in sorted(glob.glob("shots/burst-*")):
                  s = os.stat(p)
                  m = re.match(r"shots/burst-(.+)-\d{3}\.png$", p)
                  if m:
                      nf, nb = frames.get(m.group(1), (0, 0))
                      frames[m.group(1)] = (nf + 1, nb + s.st_size)
                  else:
                      listing.append(f"{s.st_size:>10}  {time.strftime('%H:%M:%SZ', time.gmtime(s.st_mtime))}  {p}")
              for r, (nf, nb) in sorted(frames.items()):
                  listing.append(f"{nb:>10}  {nf} frames  shots/burst-{r}-NNN.png")
              for ln in listing or ["no burst files"]:
                  print(f"BURST24 ls | {ln}")
          except Exception as e:
              print(f"BURST24 ls | (environment/listing readout failed: {e!r})")
          for room in ROOMS:
              idx = {}
              for p in sorted(glob.glob(f"shots/burst-{room}-[0-9][0-9][0-9].png")):
                  m = re.search(r"-(\d{3})\.png$", p)
                  if m:
                      idx[int(m.group(1)) - 1] = p          # burst-<room>-001.png is frame 0
              n = len(idx)
              if n < 2:
                  print(f"MOTION24 room={room} frames={n} delta=[] peakToMedian=nan lagMs=nan lockR=nan dupes=0 gaps=0 fold=[] beatFrames=[] rise=[] (no film)")
                  rec24(room)
                  continue
              last = max(idx)
              gaps = (last + 1) - n
              small, size = {}, None
              for k in sorted(idx):
                  im = Image.open(idx[k]).convert("L")
                  if size is None:
                      w, h = im.size
                      size = (W, max(1, round(h * W / w)))
                  small[k] = im.resize(size, Image.BILINEAR)
              deltas = {}
              for k in range(last):
                  if k in small and k + 1 in small:
                      deltas[k + 1] = ImageStat.Stat(ImageChops.difference(small[k], small[k + 1])).mean[0] / 255.0
              vals = [deltas[k] for k in sorted(deltas)]
              med = statistics.median(vals)
              p2m = (max(vals) / med) if med > 1e-9 else float("inf")
              dupes = sum(1 for v in vals if v < 1e-6)
              fold, cnt, re_, im_ = [0.0] * BINS, [0] * BINS, 0.0, 0.0
              for k, v in deltas.items():
                  ph = ((k / FPS) / PERIOD) % 1.0
                  b = min(BINS - 1, int(ph * BINS))
                  fold[b] += v
                  cnt[b] += 1
                  re_ += v * math.cos(2 * math.pi * ph)
                  im_ += v * math.sin(2 * math.pi * ph)
              prof = [(fold[b] / cnt[b]) if cnt[b] else 0.0 for b in range(BINS)]
              top = max(prof)
              bmax = max(range(BINS), key=lambda b: prof[b])
              lag_ms = (bmax + 0.5) / BINS * PERIOD * 1000.0 if top > 0 else float("nan")  # a still has no beat to place
              tot = sum(vals)
              lock_r = math.hypot(re_, im_) / tot if tot > 1e-12 else 0.0
              beat_frames, rise = [], []
              for k in range(0, 64 if top > 0 else 0):     # 4 s of film holds ~8 beats; 64 is a hard ceiling
                  f = int(round((lag_ms / 1000.0 + k * PERIOD) * FPS))
                  if f > last:
                      break
                  if f < 1:
                      continue
                  beat_frames.append(f + 1)
                  r, j = 0, f
                  while r < MAXRISE and j - 1 in deltas and j in deltas and deltas[j] > deltas[j - 1]:
                      r += 1
                      j -= 1
                  rise.append(r)
              print(f"MOTION24 room={room} frames={n} delta={[round(x, 5) for x in vals]} peakToMedian={p2m:.2f} lagMs={lag_ms:.0f}"
                    f" lockR={lock_r:.2f} dupes={dupes} gaps={gaps} fold={[round(x / top, 2) if top > 0 else 0.0 for x in prof]}"
                    f" beatFrames={beat_frames} rise={rise}")
              rec24(room)
              if n > 0 and dupes > n // 2:
                  # the simulator drew fewer frames than the film holds: the deltas are the
                  # recorder repeating a frame, not the room moving
                  distinct = n - dupes
                  print(f"REC24 room={room} | [ci] only {distinct} of {n} frames distinct (the simulator rendered ~{distinct / (n / FPS):.1f} fps): the statistics above are not the room's motion")
              first = (beat_frames[0] - 2) if beat_frames else 0  # 0-based: the last rest frame before the first peak
              first = max(0, min(first, last + 1 - MONT))
              strip = Image.new("RGB", (W * MONT, size[1]), (24, 24, 24))
              for i in range(MONT):
                  k = first + i
                  if k in idx:
                      strip.paste(Image.open(idx[k]).convert("RGB").resize(size, Image.BILINEAR), (i * W, 0))
              buf = io.BytesIO()
              strip.save(buf, format="JPEG", quality=60)
              b64 = base64.b64encode(buf.getvalue()).decode("ascii")
              print(f"MONTAGE24 room={room} frames={first + 1}..{first + MONT} firstBeatFrame={beat_frames[0] if beat_frames else 'none'}")
              print(f"== BEGIN BASE64 JPEG (burst-{room}-montage) ==")
              for i in range(0, len(b64), 300):
                  print(b64[i:i + 300])
              print(f"== END BASE64 JPEG (burst-{room}-montage) ==")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: sim-shots
          path: shots/
          retention-days: 7

  # The front of the house, photographed fast: the welcome on a fresh install
  # and the shelves (-introSeen YES) a few seconds after the library lands,
  # each printed into the log as a 960 px JPEG so a design pass can be judged
  # in minutes rather than after the room films. The welcome is also scanned
  # for PLAY's focus ring.
  ui-shots:
    name: welcome and shelves screenshots
    if: inputs.channel != 'testflight'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select newest stable Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for the tvOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project tvos/AethraKairos.xcodeproj \
            -scheme AethraKairosTV \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -5

      - name: Photograph the welcome and the shelves
        run: |
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          tv = [d for runtime, devs in devices.items() if "tvOS" in runtime for d in devs]
          def rank(d):
              name = d.get("name", "")
              return 0 if "1080p" in name else 1 if name == "Apple TV" else 2
          tv.sort(key=rank)
          if tv:
              print(tv[0]["udid"])
          ')"
          [ -n "$UDID" ] || { echo "::error::No tvOS simulator on this runner."; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "::error::Built .app not found."; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          mkdir -p ui
          xcrun simctl launch "$UDID" com.aethrakairos.tv
          sleep 16
          xcrun simctl io "$UDID" screenshot ui/welcome.png
          xcrun simctl terminate "$UDID" com.aethrakairos.tv || true
          xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES
          sleep 22
          xcrun simctl io "$UDID" screenshot ui/shelves.png
          pip3 install --quiet pillow 2>/dev/null || pip3 install --quiet --break-system-packages pillow 2>/dev/null || true
          python3 - << 'PY' || echo "pixel scan unavailable"
          from PIL import Image
          im = Image.open('ui/welcome.png').convert('RGB')
          w, h = im.size
          px = im.load()
          ice = sum(1 for y in range(0, h, 2) for x in range(0, w, 2)
                    if abs(px[x, y][0]-110) < 50 and abs(px[x, y][1]-231) < 45 and abs(px[x, y][2]-255) < 45)
          print(f"ICE PIXELS (1/4 sampled): {ice}  ({w}x{h})")
          print("VERDICT:", "FOCUS RING VISIBLE" if ice > 150 else "NO FOCUS RING")
          PY
          for NAME in welcome shelves; do
            sips -Z 960 "ui/$NAME.png" --out "ui/$NAME.jpg" -s format jpeg -s formatOptions 60 >/dev/null
            echo "== BEGIN BASE64 JPEG ($NAME) =="
            base64 -i "ui/$NAME.jpg" | fold -w 300
            echo "== END BASE64 JPEG ($NAME) =="
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-shots
          path: ui/
          retention-days: 7

  # Endurance before shipping: the listener's report was "it crashes after a
  # song or a few songs", and every check above runs for seconds. This job
  # PLAYS the real library in the simulator for twelve minutes under --soak:
  # the nonstop mix starts the moment the catalog lands, and the transport is
  # hurried (each track jumps to 28 s before its end, every fourth skips), so
  # a seam or a hard switch fires every ~30 s, ~25 track changes in all, across
  # the catalog's mix of 44.1 kHz and 48 kHz files. It fails if the app dies
  # (the host process vanishes or a crash report appears) and prints the
  # crash report, the app's own log lines, the sample rates each deck loaded
  # and the memory footprint every 30 s.
  soak:
    name: simulator soak (plays through track changes)
    if: inputs.channel != 'testflight'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select newest stable Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Give the runner an audio output (best effort)
        run: |
          # A hosted Mac has no sound card, and a simulator with no output
          # device cannot start AVAudioEngine — the soak would then test
          # downloads and pictures but never the decks. BlackHole is a virtual
          # output device; coreaudiod is restarted to pick it up. If any of
          # this fails the soak still runs and its log says the engine stayed
          # stopped.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask blackhole-2ch || echo "::warning::BlackHole did not install"
          sudo killall -9 coreaudiod 2>/dev/null || true
          sleep 3
          system_profiler SPAudioDataType 2>/dev/null | sed -n '1,40p' || true

      - name: Build for the tvOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project tvos/AethraKairos.xcodeproj \
            -scheme AethraKairosTV \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -5

      - name: Play for twelve minutes
        run: |
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          tv = [d for runtime, devs in devices.items() if "tvOS" in runtime for d in devs]
          def rank(d):
              name = d.get("name", "")
              return 0 if "1080p" in name else 1 if name == "Apple TV" else 2
          tv.sort(key=rank)
          if tv:
              print(tv[0]["udid"])
          ')"
          if [ -z "$UDID" ]; then
            RUNTIME="$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "tvOS" and r.get("isAvailable")]
          print(rts[-1]["identifier"] if rts else "")
          ')"
            [ -n "$RUNTIME" ] || { echo "::error::No tvOS simulator runtime on this runner."; exit 1; }
            UDID="$(xcrun simctl create soak-atv 'Apple TV 4K (3rd generation) (at 1080p)' "$RUNTIME" 2>/dev/null \
                    || xcrun simctl create soak-atv 'Apple TV 4K (3rd generation)' "$RUNTIME")"
          fi
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "::error::Built .app not found."; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          mkdir -p soak
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          ls "$REPORTS" 2>/dev/null | grep -i aethra > soak/reports-before.txt || true
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'eventMessage CONTAINS "AethraKairos"' > soak/app.log 2>&1 &
          LOGPID=$!
          sleep 2
          xcrun simctl launch "$UDID" com.aethrakairos.tv -introSeen YES --field --soak
          sleep 5
          PID="$(pgrep -f 'AethraKairosTV.app/AethraKairosTV' | head -1 || true)"
          echo "app pid: ${PID:-none}"
          ALIVE=yes
          T=0
          SOAK_SECONDS=720
          while [ "$T" -lt "$SOAK_SECONDS" ]; do
            sleep 15
            T=$((T + 15))
            if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
              ALIVE=no
              echo "::error::the app process is gone ${T} s into the soak"
              break
            fi
            if [ $((T % 60)) -eq 0 ]; then
              echo "t=${T}s alive; $(grep -c 'soak: track' soak/app.log || true) tracks so far"
            fi
          done
          xcrun simctl io "$UDID" screenshot soak/final.png 2>/dev/null || true
          sleep 2
          kill "$LOGPID" 2>/dev/null || true
          ls "$REPORTS" 2>/dev/null | grep -i aethra > soak/reports-after.txt || true
          NEW="$(comm -13 <(sort soak/reports-before.txt) <(sort soak/reports-after.txt) || true)"
          echo "===== the soak, in the app's own words ====="
          grep -E 'soak:|REWIRING|rewiring|exception|engine|recovery|media services|cannot open|deferring|skip crossfade|art step' soak/app.log | tail -250 || true
          echo "===== summary ====="
          echo "tracks reached:  $(grep -c 'soak: track' soak/app.log || true)"
          echo "deck loads:      $(grep -c 'loads .* Hz' soak/app.log || true)"
          echo "  at 44100 Hz:   $(grep -c 'loads 44100 Hz' soak/app.log || true)"
          echo "  at 48000 Hz:   $(grep -c 'loads 48000 Hz' soak/app.log || true)"
          echo "live rewires:    $(grep -c 'REWIRING LIVE' soak/app.log || true)"
          echo "caught raises:   $(grep -c 'AVFAudio raised' soak/app.log || true)"
          echo "skip crossfades: $(grep -c 'skip crossfade' soak/app.log || true)"
          echo "art steps:       $(grep -c 'art step' soak/app.log || true)  (last: $(grep 'art step' soak/app.log | tail -1 | sed 's/.*art step/art step/'))"
          echo "engine running in reports: $(grep -c 'engine running' soak/app.log || true) / $(grep -c 'soak: footprint' soak/app.log || true)"
          echo "process alive at the end: $ALIVE"
          CRASHED=no
          if [ -n "$NEW" ]; then
            CRASHED=yes
            for f in $NEW; do
              echo "===== crash report: $f ====="
              cp "$REPORTS/$f" soak/ 2>/dev/null || true
              head -c 20000 "$REPORTS/$f" || true
              echo
            done
          fi
          if [ "$ALIVE" != yes ] || [ "$CRASHED" = yes ]; then
            echo "::error::the app did not survive the soak"
            exit 1
          fi
          if ! grep -q 'engine running' soak/app.log; then
            echo "::warning::the audio engine never ran in the simulator (no output device?) — the decks were not exercised"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak
          path: soak/
          retention-days: 7

  testflight:
    name: archive · sign · upload to TestFlight
    if: inputs.channel == 'testflight'
    runs-on: macos-15
    steps:
      - name: Refuse until the switch is on
        if: vars.ENABLE_TVOS_SIGNING != 'true'
        run: |
          echo "::error::ENABLE_TVOS_SIGNING is not 'true'. Follow tvos/TESTFLIGHT.md" \
                "parts 3–4 to create the App Store Connect API key and the secrets," \
                "then set the repo variable. Refusing before spending a build."
          exit 1

      - uses: actions/checkout@v7

      - name: Select newest stable Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Materialize the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          # a truncated paste produces a key openssl can't parse — fail here,
          # with a named cause, not twenty minutes later inside xcodebuild
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout \
            || { echo "::error::ASC_API_KEY_P8_BASE64 does not decode to a valid .p8 (truncated paste?)"; exit 1; }

      - name: Archive (unsigned — the export step does all the signing)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signing OFF on purpose: a signed archive would need a *development*
          # profile, and those require a registered device the team may not
          # have. -exportArchive signs the whole app for App Store distribution
          # (no devices needed) — see the header comment.
          xcodebuild archive \
            -project tvos/AethraKairos.xcodeproj \
            -scheme AethraKairosTV \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/AethraKairos.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          set -o pipefail
          # App Store Connect's upload endpoint intermittently answers 502 /
          # "The server returned unexpected content" (-19237); four of five
          # uploads one evening needed a manual re-run for exactly this. The
          # archive is already built, so retry ONLY that transient signature —
          # a real signing or configuration error still fails on the spot.
          for attempt in 1 2 3 4; do
            if xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/AethraKairos.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              2>&1 | tee "$RUNNER_TEMP/export.log"; then
              echo "Uploaded. Apple processes for 5–30 min, then the build appears" \
                   "under TestFlight in App Store Connect (tvos/TESTFLIGHT.md part 6)."
              exit 0
            fi
            if ! grep -qE 'Code=-19237|returned unexpected content|status code 50[0-9]' \
                 "$RUNNER_TEMP/export.log"; then
              echo "Upload failed for a non-transient reason — not retrying."
              exit 1
            fi
            if [ "$attempt" = 4 ]; then
              echo "App Store Connect still failing after 4 attempts — giving up."
              exit 1
            fi
            wait=$((attempt * 120))
            echo "App Store Connect hiccuped (attempt $attempt of 4) — retrying in ${wait}s…"
            sleep "$wait"
          done

      # xcodebuild's one-line "Cloud signing permission error" hides the real
      # cause (license agreement not accepted, key role too weak, missing app
      # record, …) inside an xcdistributionlogs bundle it only names in the
      # output. On failure, dig it out so the run log itself says why.
      - name: Surface the real signing error on failure
        if: failure()
        run: |
          BUNDLE="$(sed -n 's/.*Created bundle at path "\([^"]*xcdistributionlogs\)".*/\1/p' \
                    "$RUNNER_TEMP/export.log" 2>/dev/null | head -1)"
          if [ -d "$BUNDLE" ]; then
            echo "===== IDEDistribution.standard.log (last 150 lines) ====="
            tail -150 "$BUNDLE/IDEDistribution.standard.log" 2>/dev/null || true
            for f in "$BUNDLE"/*.log; do
              [ "$f" = "$BUNDLE/IDEDistribution.standard.log" ] && continue
              echo "===== $(basename "$f") (last 60 lines) ====="
              tail -60 "$f" 2>/dev/null || true
            done
          else
            echo "No xcdistributionlogs bundle referenced in export.log (the failure was before export)."
          fi
