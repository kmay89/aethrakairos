# The site IS the player, and it lives in docs/ (player, manifest, service
# worker, icons, catalog.json) — publish that, not the repo root.
#
# WHERE PRODUCTION ACTUALLY IS (learned 2026-08-05, the hard way):
# aethrakairos.com and www.aethrakairos.com both resolve to THIS Netlify
# project — the same addresses as aethrakairos.netlify.app. HOSTING.md's
# GitHub Pages checklist was never completed: the repo has no Pages
# deployments and the domain's DNS points here. Production is Netlify,
# so this file configures production.
#
# WHERE THE MUSIC ACTUALLY IS (2026-08-07): a Cloudflare R2 bucket at
# media.aethrakairos.com. The audio has GRADUATED off this host — see
# HOSTING.md §5. docs/audio/ is still the master copy in the repo (the
# pipeline, the fingerprint index and the stems job all read it), but no
# deploy ships it any more: 1.09 GB per deploy is what exhausted this
# account's usage on 2026-08-04 and paused the project.
#
# THE RULE THAT MUST NOT BE BROKEN AGAIN: a redirect for /audio/* may only
# ever point at a DIFFERENT host. On 2026-08-04 one pointed at
# aethrakairos.com — which IS this site — and every track request 302'd to
# itself until the browser gave up: the player booted, the catalog listed
# all 264 tracks, and no audio could ever arrive. The rule below targets
# media.aethrakairos.com, so it cannot close that loop.
[build]
  publish = "docs"
  # Strip the audio from EVERY deploy and hand /audio/* to the bucket. The
  # redirect is not dead weight: sw.js serves catalog.json
  # stale-while-revalidate, so a returning listener plays a whole session
  # off the OLD catalog — the one whose base is still the same-origin
  # 'audio' tree — before the new one lands. This rule is what keeps that
  # session playing. The ! keeps it answering even though the directory is
  # absent.
  command = "rm -rf docs/audio && echo '/audio/* https://media.aethrakairos.com/audio/:splat 302!' > docs/_redirects"

# the service worker must never be served stale, or updates stall
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# NOTE — two things this host used to do for /audio/* that the BUCKET must
# now do, because nothing here serves those bytes any more:
#
#   Access-Control-Allow-Origin: *   the player sets crossOrigin='anonymous'
#                                    so the analyser can read the stream; a
#                                    bucket without CORS plays silently to
#                                    the eye, or not at all
#   X-Robots-Tag: noindex, nofollow  keeps crawlers out of the tracks;
#                                    docs/robots.txt asks politely, a header
#                                    insists — and robots.txt does not reach
#                                    across to media.aethrakairos.com
#
# `make_catalog.py doctor` (without --no-net) is the acceptance test: it
# samples real track URLs and demands 206 + Access-Control-Allow-Origin: *.
