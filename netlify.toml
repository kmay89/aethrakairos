# The site IS the player, and it lives in docs/ (player, manifest, service
# worker, icons, catalog.json, audio) — publish that, not the repo root.
#
# WHERE PRODUCTION ACTUALLY IS (learned 2026-08-05, the hard way):
# aethrakairos.com and www.aethrakairos.com both resolve to THIS Netlify
# project — the same addresses as aethrakairos.netlify.app. HOSTING.md's
# GitHub Pages checklist was never completed: the repo has no Pages
# deployments and the domain's DNS points here. Production is Netlify,
# so this file configures production.
#
# That is why the 2026-08-04 change silenced the site. It stripped the
# audio from EVERY build and redirected /audio/* to aethrakairos.com, on
# the belief that aethrakairos.com was a different host that still had
# the files. It was this site. From the next production deploy on, every
# track request 302'd to itself until the browser gave up: the player
# booted, the catalog listed all 264 tracks, and no audio could ever
# arrive.
#
# The strip was still right for the builds it was written about — nine PR
# previews in one evening (2026-08-04) each shipped 1.1 GB, exhausted the
# account's usage and PAUSED the project. So it lives on below, scoped to
# preview and branch builds only. Production ships the music, because
# production is where the music lives.
[build]
  publish = "docs"

# PREVIEWS: strip the 1.1 GB and borrow production's audio instead. The
# redirect is written as a _redirects file by the same command that
# deletes the files, so it can only exist in a build that has nothing
# real at /audio/* — production never sees the rule and can never loop
# again. The ! keeps the rule answering even though the directory is
# absent. Cross-origin playback works because production sends
# Access-Control-Allow-Origin on /audio/* (below) and the player already
# sets crossOrigin='anonymous' for the analyser.
[context.deploy-preview]
  command = "rm -rf docs/audio && echo '/audio/* https://aethrakairos.com/audio/:splat 302!' > docs/_redirects"

[context.branch-deploy]
  command = "rm -rf docs/audio && echo '/audio/* https://aethrakairos.com/audio/:splat 302!' > docs/_redirects"

# the service worker must never be served stale, or updates stall
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Production serves the music to its own pages (same origin) and to
# deploy previews (cross origin, via the redirect above): the ACAO header
# is what lets a preview's crossOrigin='anonymous' <audio> read the
# stream. The robots tag keeps crawlers out of the tracks — docs/robots.txt
# asks politely, this header insists.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Robots-Tag = "noindex, nofollow"
