# The site IS the player, and it lives in docs/ (player, manifest, service
# worker, icons, catalog.json) — publish that, not the repo root.
#
# WHERE PRODUCTION ACTUALLY IS (learned 2026-08-05, the hard way):
# aethrakairos.com and www.aethrakairos.com both resolve to THIS Netlify
# project — the same addresses as aethrakairos.netlify.app. HOSTING.md's
# GitHub Pages checklist was never completed: the repo has no Pages
# deployments and the domain's DNS points here. Production is Netlify,
# so this file configures production.
#
# WHERE THE MUSIC ACTUALLY IS (2026-08-07): a Cloudflare R2 bucket at
# media.aethrakairos.com. The audio has GRADUATED off this host — see
# HOSTING.md §5. docs/audio/ is still the master copy in the repo (the
# pipeline, the fingerprint index and the stems job all read it), but no
# deploy ships it any more: 1.09 GB per deploy is what exhausted this
# account's usage on 2026-08-04 and paused the project.
#
# THE RULE THAT MUST NOT BE BROKEN AGAIN: a redirect for /audio/* may only
# ever point at a DIFFERENT host. On 2026-08-04 one pointed at
# aethrakairos.com — which IS this site — and every track request 302'd to
# itself until the browser gave up: the player booted, the catalog listed
# all 264 tracks, and no audio could ever arrive. The rule below targets
# media.aethrakairos.com, so it cannot close that loop.
[build]
  publish = "docs"
  # Strip the audio from EVERY deploy and hand /audio/* to the bucket. The
  # redirect is not dead weight: sw.js serves catalog.json
  # stale-while-revalidate, so a returning listener plays a whole session
  # off the OLD catalog — the one whose base is still the same-origin
  # 'audio' tree — before the new one lands. This rule is what keeps that
  # session playing. The ! keeps it answering even though the directory is
  # absent.
  #
  # AND STAMP EVERY DEPLOY HERE, AT BUILD TIME. The stamp used to arrive only
  # as a follow-up commit from the stamp workflow, so every release reached
  # production TWICE: first the merge commit, un-stamped (new bytes wearing the
  # old build id), then the stamp commit a few minutes later. Every listener
  # caught between the two was offered an "update" to the build number they
  # were already on, and then offered a second one. Stamping here makes the
  # merge deploy complete on its own; the stamp is content-derived and
  # idempotent, so the stamp commit's deploy is byte-identical and nobody's
  # worker sees it at all. Fail-safe: if Python is missing the deploy carries
  # on exactly as before.
  command = "(python3 tools/stamp_version.py || echo 'stamp skipped - deploying as committed') && rm -rf docs/audio && echo '/audio/* https://media.aethrakairos.com/audio/:splat 302!' > docs/_redirects"

# The App Store's privacy-policy and support URLs (tvos/APP-REVIEW.md §6):
# clean paths onto the two static pages.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

# The baseline every page gets. HSTS keeps every visit on https (no
# includeSubDomains: other hosts under the name are not this site's to bind);
# nosniff stops a file being run as a type it isn't; the referrer stops at the
# origin. Framing is deliberately left open (a sister site may embed the
# player); X-Frame-Options / frame-ancestors and a Content-Security-Policy are
# the next steps, the CSP after a report-only trial (the player is
# inline-heavy).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # powers the player never uses, refused outright, so nothing it loads
    # could ever ask for them (the microphone and MIDI stay: the mic-reactive
    # visual and the piano use them, always behind the browser's own prompt)
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# the self-hosted type (docs/fonts/): the files never change in place — a
# new font version is a new file — so a month in the browser's cache is safe
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# the notices are UTF-8 plain text (em dashes, ö): say so, or a browser
# guesses Latin-1 and the credits arrive as mojibake
[[headers]]
  for = "/third-party-notices.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# the service worker must never be served stale, or updates stall
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# NOTE — two things this host used to do for /audio/* that the BUCKET must
# now do, because nothing here serves those bytes any more:
#
#   Access-Control-Allow-Origin: *   the player sets crossOrigin='anonymous'
#                                    so the analyser can read the stream; a
#                                    bucket without CORS plays silently to
#                                    the eye, or not at all
#   X-Robots-Tag: noindex, nofollow  keeps crawlers out of the tracks;
#                                    docs/robots.txt asks politely, a header
#                                    insists — and robots.txt does not reach
#                                    across to media.aethrakairos.com
#
# `make_catalog.py doctor` (without --no-net) is the acceptance test: it
# samples real track URLs and demands 206 + Access-Control-Allow-Origin: *.
